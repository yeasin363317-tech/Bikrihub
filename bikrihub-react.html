/* ================= TOAST ================= */
function useToast(){
  const [msg, setMsg] = useState(null);
  const timer = useRef(null);
  const show = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(()=>setMsg(null), 2200); };
  return [msg, show];
}

/* ================= ROOT APP ================= */
function App(){
  const [lang, setLang] = useState('bn');
  const [products, setProducts] = useState([]);
  const [settings, setSettings] = useState({ site_name_en:'Bikri Hub', site_name_bn:'বিক্রি হাব', logo_url:null, hero_image_url:null, phone:'', address:'', delivery_charge_dhaka:70, delivery_charge_outside:130 });
  const [cart, setCart] = useState([]);
  const [route, setRoute] = useState(window.location.hash.startsWith('#admin') ? 'admin' : 'store');
  const [toastMsg, showToast] = useToast();

  useEffect(()=>{
    const onHash = ()=> setRoute(window.location.hash.startsWith('#admin') ? 'admin' : 'store');
    window.addEventListener('hashchange', onHash);
    return ()=> window.removeEventListener('hashchange', onHash);
  },[]);

  useEffect(()=>{
    (async ()=>{
      const { data: s } = await sb.from('site_settings').select('*').eq('id',1).single();
      if(s) setSettings(s);
      const { data: p } = await sb.from('products').select('*').order('created_at',{ascending:false});
      if(p) setProducts(p);
    })();
  },[]);

  const t = (key) => DICT[lang][key] || key;

  const addToCart = (product, qty) => {
    setCart(prev=>{
      const ex = prev.find(c=>c.id===product.id);
      if(ex){ return prev.map(c=> c.id===product.id ? {...c, qty: Math.min(c.qty+qty, product.stock ?? 999)} : c); }
      return [...prev, { id:product.id, name:product.name, price:product.price, image_url:product.image_url, qty: Math.min(qty, product.stock ?? 999), stock: product.stock }];
    });
    showToast('✅ ' + t('toastAdded'));
  };
  const changeQty = (id, delta) => {
    setCart(prev=>{
      const next = prev.map(c=> c.id===id ? {...c, qty:c.qty+delta} : c).filter(c=>c.qty>0);
      return next;
    });
  };
  const removeFromCart = (id) => { setCart(prev=>prev.filter(c=>c.id!==id)); showToast(t('toastRemoved')); };
  const clearCart = () => setCart([]);

  const ctx = { lang, setLang, t, products, setProducts, settings, setSettings, cart, addToCart, changeQty, removeFromCart, clearCart, showToast };

  return (
    <AppCtx.Provider value={ctx}>
      {route === 'admin' ? <AdminApp/> : <StoreApp/>}
      <Toast msg={toastMsg}/>
    </AppCtx.Provider>
  );
}

function Toast({msg}){
  if(!msg) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white px-5 py-3 rounded-full text-sm font-semibold shadow-2xl z-[500] fade-in">
      {msg}
    </div>
  );
}

/* ---------- Checkout modal ---------- */
function CheckoutModal({onClose, onSuccess}){
  const { t, lang, cart, settings, clearCart, showToast } = useApp();
  const [form, setForm] = useState({ name:'', phone:'', address:'', city:'Dhaka', notes:'' });
  const [loading, setLoading] = useState(false);
  const subtotal = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const fee = form.city==='Dhaka' ? Number(settings.delivery_charge_dhaka||70) : Number(settings.delivery_charge_outside||130);
  const total = subtotal + fee;

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    try{
      const orderNumber = 'BH' + Date.now().toString().slice(-8) + Math.floor(Math.random()*90+10);
      const { data: order, error: oErr } = await sb.from('orders').insert({
        order_number: orderNumber, customer_name: form.name, phone: form.phone, address: form.address,
        city: form.city, notes: form.notes, subtotal, total, status:'pending'
      }).select().single();
      if(oErr) throw oErr;
      const items = cart.map(c=>({ order_id: order.id, product_id: c.id, product_name: c.name, price: c.price, quantity: c.qty }));
      const { error: iErr } = await sb.from('order_items').insert(items);
      if(iErr) throw iErr;
      clearCart();
      onSuccess({ order_number: orderNumber });
    }catch(err){
      console.error(err);
      showToast('⚠️ ' + t('errGeneric'));
    }finally{ setLoading(false); }
  };

  return (
    <Modal onClose={onClose} title={t('checkoutTitle')}>
      <form onSubmit={submit} className="space-y-4">
        <Field label={t('fullName')}><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        <Field label={t('phoneNum')}><input required type="tel" placeholder="01XXXXXXXXX" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        <Field label={t('fullAddr')}><textarea required rows="2" value={form.address} onChange={e=>setForm({...form,address:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        <Field label={t('deliveryArea')}>
          <select value={form.city} onChange={e=>setForm({...form,city:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen">
            <option value="Dhaka">{t('insideDhaka')}</option>
            <option value="Outside">{t('outsideDhaka')}</option>
          </select>
        </Field>
        <Field label={t('orderNote')}><textarea rows="2" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>

        <div className="bg-linen rounded-2xl p-4 space-y-1.5">
          <div className="flex justify-between text-sm"><span className="text-inksoft">{t('subtotal')}</span><b>{fmtMoney(subtotal)}</b></div>
          <div className="flex justify-between text-sm"><span className="text-inksoft">{t('deliveryFee')}</span><b>{fmtMoney(fee)}</b></div>
          <div className="flex justify-between font-disp-en font-bold text-base pt-1.5 border-t border-line/60"><span>{t('totalLabel')}</span><span>{fmtMoney(total)}</span></div>
        </div>

        <button type="submit" disabled={loading} className="w-full bg-rose text-white font-semibold py-3.5 rounded-full hover:opacity-90 transition disabled:opacity-50 flex items-center justify-center gap-2">
          {loading ? <span className="spinner"></span> : '💵'} {t('placeOrder')}
        </button>
      </form>
    </Modal>
  );
}
function Field({label, children}){
  return <div><label className="text-xs font-semibold text-inksoft block mb-1.5">{label}</label>{children}</div>;

function AdminApp(){
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out

  useEffect(()=>{
    sb.auth.getSession().then(({data})=> setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess)=> setSession(sess));
    return ()=> sub.subscription.unsubscribe();
  },[]);

  if(session === undefined) return <div className="min-h-screen flex items-center justify-center text-inksoft">Loading…</div>;
  return session ? <AdminDashboard/> : <AdminLogin/>;
}

function AdminDashboard(){

  const loadSettings = async () => { const {data} = await sb.from('site_settings').select('*').eq('id',1).single(); setSettings(data); };

  useEffect(()=>{ loadProducts(); loadOrders(); loadSettings(); },[]);

  const stats = {
    products: products.length,
    orders: orders.length,
    pending: orders.filter(o=>o.status==='pending').length,

  };
  const deleteOrder = async (id) => {
    if(!confirm('এই অর্ডারটি মুছে ফেলতে চান?')) return;

      </div>

      <div className="max-w-6xl mx-auto px-5 py-8">
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-7">
          <StatCard label="মোট পণ্য" value={stats.products}/>
          <StatCard label="মোট অর্ডার" value={stats.orders}/>
          <StatCard label="পেন্ডিং অর্ডার" value={stats.pending}/>
          <StatCard label="মোট বিক্রি" value={fmtMoney(stats.revenue)}/>
        </div>

        <div className="flex gap-2 mb-6 flex-wrap">
          {[['products','📦 পণ্য'],['orders','🧾 অর্ডার'],['settings','⚙️ সেটিংস']].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} className={"px-5 py-2.5 rounded-full font-semibold text-sm border transition " + (tab===k ? "bg-forest text-white border-forest":"bg-white border-line text-inksoft")}>{l}</button>
          ))}
        </div>

        {tab==='products' && (
          <div className="bg-white rounded-2xl border border-line p-6">
            <div className="flex justify-between items-center mb-5">
              <h3 className="font-disp-en font-semibold text-lg">পণ্য তালিকা</h3>
              <button onClick={()=>setEditingProduct(null)} className="bg-forest text-white text-sm font-semibold px-4 py-2 rounded-full hover:bg-forestdeep">+ নতুন পণ্য</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-xs uppercase text-inksoft border-b-2 border-line">
                  <th className="py-2 px-2">ছবি</th><th className="px-2">নাম</th><th className="px-2">ক্যাটাগরি</th><th className="px-2">দাম</th><th className="px-2">স্টক</th><th className="px-2"></th>
                </tr></thead>
                <tbody>
                  {products.map(p=>(
                    <tr key={p.id} className="border-b border-line">
                      <td className="py-2 px-2">{p.image_url ? <img src={p.image_url} className="w-10 h-10 rounded-lg object-cover"/> : '—'}</td>
                      <td className="px-2 font-medium">{p.name}</td>
                      <td className="px-2"><span className="text-xs bg-linen px-2 py-1 rounded-full">{p.category}</span></td>
                      <td className="px-2">{fmtMoney(p.price)}</td>
                      <td className="px-2">{p.stock}</td>
                      <td className="px-2 whitespace-nowrap">
                        <button onClick={()=>setEditingProduct(p)} className="w-8 h-8 rounded-lg bg-linen mr-1">✏️</button>
                        <button onClick={()=>deleteProduct(p.id)} className="w-8 h-8 rounded-lg bg-rose/10 text-rose">🗑️</button>
                      </td>
                    </tr>
                  ))}
                  {products.length===0 && <tr><td colSpan="6" className="text-center py-8 text-inksoft">কোনো পণ্য নেই</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab==='orders' && (
          <div className="bg-white rounded-2xl border border-line p-6">
            <h3 className="font-disp-en font-semibold text-lg mb-5">সকল অর্ডার</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-xs uppercase text-inksoft border-b-2 border-line">
                  <th className="py-2 px-2">অর্ডার#</th><th className="px-2">কাস্টমার</th><th className="px-2">ফোন</th><th className="px-2">মোট</th><th className="px-2">স্ট্যাটাস</th><th className="px-2">তারিখ</th><th className="px-2"></th>
                </tr></thead>
                <tbody>
                  {orders.map(o=>(
                    <tr key={o.id} className="border-b border-line">
                      <td className="py-2 px-2 font-medium">#{o.order_number}</td>
                      <td className="px-2">{o.customer_name}</td>
                      <td className="px-2">{o.phone}</td>
                      <td className="px-2">{fmtMoney(o.total)}</td>
                      <td className="px-2"><StatusBadge status={o.status}/></td>
                      <td className="px-2">{new Date(o.created_at).toLocaleDateString('en-GB')}</td>
                      <td className="px-2 whitespace-nowrap">
                        <button onClick={()=>setViewingOrder(o)} className="w-8 h-8 rounded-lg bg-linen mr-1">👁️</button>
                        <button onClick={()=>deleteOrder(o.id)} className="w-8 h-8 rounded-lg bg-rose/10 text-rose">🗑️</button>
                      </td>
                    </tr>
                  ))}
                  {orders.length===0 && <tr><td colSpan="7" className="text-center py-8 text-inksoft">কোনো অর্ডার নেই</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab==='settings' && settings && <SettingsPanel settings={settings} onSaved={(s)=>{ setSettings(s); showToast('✅ সেটিংস সংরক্ষণ করা হয়েছে'); }}/>}
      </div>

      {editingProduct !== undefined && (
        <ProductFormModal product={editingProduct} onClose={()=>setEditingProduct(undefined)} onSaved={()=>{ setEditingProduct(undefined); loadProducts(); showToast('✅ সংরক্ষণ করা হয়েছে'); }}/>
      )}
      {viewingOrder && <OrderDetailModal order={viewingOrder} onClose={()=>setViewingOrder(null)} onUpdated={()=>{ setViewingOrder(null); loadOrders(); showToast('✅ স্ট্যাটাস আপডেট হয়েছে'); }}/>}
      <Toast msg={toastMsg}/>
    </div>
  );
}

function StatCard({label, value}){
  return <div className="bg-white border border-line rounded-2xl p-4"><div className="font-disp-en font-bold text-2xl text-ink">{value}</div><div className="text-xs text-inksoft">{label}</div></div>;
}
function StatusBadge({status}){
  const map = { pending:'bg-amber-100 text-amber-700', confirmed:'bg-blue-100 text-blue-700', shipped:'bg-purple-100 text-purple-700', delivered:'bg-green-100 text-green-700', cancelled:'bg-red-100 text-red-700' };
  return <span className={"text-xs font-bold px-2.5 py-1 rounded-full " + (map[status]||'bg-gray-100')}>{status}</span>;
}

async function uploadToMedia(file, folder){
  const ext = file.name.split('.').pop();
  const path = folder + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const { error } = await sb.storage.from('media').upload(path, file, { upsert:true });
  if(error) throw error;
  const { data } = sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}

function ProductFormModal({product, onClose, onSaved}){
  const isEdit = !!product;
  const [form, setForm] = useState({
    name: product?.name||'', description: product?.description||'', category: product?.category||'Fashion',
    stock: product?.stock ?? 100, price: product?.price||'', compare_price: product?.compare_price||'', featured: product?.featured||false
  });
  const [imgFile, setImgFile] = useState(null);
  const [imgPreview, setImgPreview] = useState(product?.image_url || null);
  const [loading, setLoading] = useState(false);

  const onFile = (e) => {
    const file = e.target.files[0]; if(!file) return;
    setImgFile(file);
    const reader = new FileReader();
    reader.onload = ()=> setImgPreview(reader.result);
    reader.readAsDataURL(file);
  };

  const submit = async (e) => {
    e.preventDefault(); setLoading(true);
    try{
      let imageUrl = product?.image_url || null;
      if(imgFile) imageUrl = await uploadToMedia(imgFile, 'products');
      const payload = {
        name: form.name.trim(), description: form.description.trim(), category: form.category,
        stock: parseInt(form.stock||0), price: parseFloat(form.price),
        compare_price: form.compare_price ? parseFloat(form.compare_price) : null,
        featured: form.featured, image_url: imageUrl
      };
      if(isEdit){
        const { error } = await sb.from('products').update(payload).eq('id', product.id);
        if(error) throw error;
      } else {
        payload.slug = payload.name.toLowerCase().trim().replace(new RegExp('[^a-z0-9\u0980-\u09FF]+','g'),'-').replace(/^-+|-+$/g,'') + '-' + Date.now().toString().slice(-5);
        const { error } = await sb.from('products').insert(payload);
        if(error) throw error;
      }
      onSaved();
    }catch(err){ console.error(err); alert('সংরক্ষণ করতে সমস্যা হয়েছে'); }
    finally{ setLoading(false); }
  };

  return (
    <Modal onClose={onClose} title={isEdit ? 'পণ্য সম্পাদনা করুন' : 'নতুন পণ্য যোগ করুন'}>
      <form onSubmit={submit} className="space-y-4">
        <Field label="পণ্যের ছবি">
          <label className="block border-2 border-dashed border-line rounded-xl p-4 text-center cursor-pointer bg-linen">
            {imgPreview ? <img src={imgPreview} className="max-h-28 mx-auto mb-2 rounded-lg"/> : <span className="text-sm text-inksoft">📤 ছবি আপলোড করতে ক্লিক করুন</span>}
            <input type="file" accept="image/*" className="hidden" onChange={onFile}/>
          </label>
        </Field>
        <Field label="পণ্যের নাম"><input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        <Field label="বিবরণ"><textarea rows="3" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="ক্যাটাগরি">
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen">
              <option value="Fashion">Fashion</option><option value="Gadgets">Gadgets</option>
            </select>
          </Field>
          <Field label="স্টক"><input type="number" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="দাম (৳)"><input required type="number" step="0.01" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
          <Field label="আগের দাম (ঐচ্ছিক)"><input type="number" step="0.01" value={form.compare_price} onChange={e=>setForm({...form,compare_price:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        </div>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.featured} onChange={e=>setForm({...form,featured:e.target.checked})}/> হোমপেজে ফিচার্ড দেখান</label>
        <button disabled={loading} className="w-full bg-forest text-white font-semibold py-3 rounded-full hover:bg-forestdeep flex items-center justify-center gap-2">{loading && <span className="spinner"></span>} পণ্য সংরক্ষণ করুন</button>
      </form>
    </Modal>
  );
}

function OrderDetailModal({order, onClose, onUpdated}){
  const [items, setItems] = useState([]);
  const [status, setStatus] = useState(order.status);
  const [loading, setLoading] = useState(false);
  useEffect(()=>{ sb.from('order_items').select('*').eq('order_id', order.id).then(({data})=>setItems(data||[])); },[]);

  const update = async () => {
    setLoading(true);
    const { error } = await sb.from('orders').update({ status }).eq('id', order.id);
    setLoading(false);
    if(!error) onUpdated();
  };

  return (
    <Modal onClose={onClose} title="অর্ডার বিস্তারিত">
      <div className="flex justify-between items-start mb-3">
        <div><b>{order.customer_name}</b><div className="text-sm text-inksoft">{order.phone}</div></div>
        <StatusBadge status={order.status}/>
      </div>
      <p className="text-sm text-inksoft mb-3">📍 {order.address}, {order.city}</p>
      {order.notes && <p className="text-sm bg-linen rounded-lg px-3 py-2 mb-3">📝 {order.notes}</p>}
      <div className="border-t border-line pt-3 space-y-1.5">
        {items.map(it=>(
          <div key={it.id} className="flex justify-between text-sm"><span>{it.product_name} × {it.quantity}</span><b>{fmtMoney(it.price*it.quantity)}</b></div>
        ))}
        <div className="flex justify-between font-disp-en font-bold pt-2 border-t border-dashed border-line"><span>Total</span><span>{fmtMoney(order.total)}</span></div>
      </div>
      <Field label="স্ট্যাটাস পরিবর্তন করুন">
        <select value={status} onChange={e=>setStatus(e.target.value)} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen mt-1">
          {['pending','confirmed','shipped','delivered','cancelled'].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <button disabled={loading} onClick={update} className="w-full bg-forest text-white font-semibold py-3 rounded-full hover:bg-forestdeep mt-4 flex items-center justify-center gap-2">{loading && <span className="spinner"></span>} স্ট্যাটাস আপডেট করুন</button>
    </Modal>
  );
}

function SettingsPanel({settings, onSaved}){
  const [form, setForm] = useState(settings);
  const [logoFile, setLogoFile] = useState(null);
  const [logoPreview, setLogoPreview] = useState(settings.logo_url);
  const [heroFile, setHeroFile] = useState(null);
  const [heroPreview, setHeroPreview] = useState(settings.hero_image_url);
  const [loading, setLoading] = useState(false);

  const onLogoFile = (e) => { const f=e.target.files[0]; if(!f) return; setLogoFile(f); const r=new FileReader(); r.onload=()=>setLogoPreview(r.result); r.readAsDataURL(f); };
  const onHeroFile = (e) => { const f=e.target.files[0]; if(!f) return; setHeroFile(f); const r=new FileReader(); r.onload=()=>setHeroPreview(r.result); r.readAsDataURL(f); };

  const submit = async (e) => {
    e.preventDefault(); setLoading(true);
    try{
      let logoUrl = settings.logo_url, heroUrl = settings.hero_image_url;
      if(logoFile) logoUrl = await uploadToMedia(logoFile, 'branding');
      if(heroFile) heroUrl = await uploadToMedia(heroFile, 'branding');
      const payload = {
        site_name_en: form.site_name_en, site_name_bn: form.site_name_bn,
        phone: form.phone, address: form.address,
        delivery_charge_dhaka: parseFloat(form.delivery_charge_dhaka||0),
        delivery_charge_outside: parseFloat(form.delivery_charge_outside||0),
        logo_url: logoUrl, hero_image_url: heroUrl, updated_at: new Date().toISOString()
      };
      const { error } = await sb.from('site_settings').update(payload).eq('id',1);
      if(error) throw error;
      onSaved({...settings, ...payload});
    }catch(err){ console.error(err); alert('সংরক্ষণ করতে সমস্যা হয়েছে'); }
    finally{ setLoading(false); }
  };

  return (
    <div className="bg-white rounded-2xl border border-line p-6 max-w-xl">
      <h3 className="font-disp-en font-semibold text-lg mb-5">দোকানের সেটিংস</h3>
      <form onSubmit={submit} className="space-y-4">
        <Field label="লোগো">
          <label className="block border-2 border-dashed border-line rounded-xl p-4 text-center cursor-pointer bg-linen">
            {logoPreview ? <img src={logoPreview} className="max-h-20 mx-auto mb-2 rounded-lg"/> : <span className="text-sm text-inksoft">📤 লোগো আপলোড করুন</span>}
            <input type="file" accept="image/*" className="hidden" onChange={onLogoFile}/>
          </label>
        </Field>
        <Field label="হোমপেজ হিরো ছবি">
          <label className="block border-2 border-dashed border-line rounded-xl p-4 text-center cursor-pointer bg-linen">
            {heroPreview ? <img src={heroPreview} className="max-h-28 mx-auto mb-2 rounded-lg"/> : <span className="text-sm text-inksoft">📤 হিরো ছবি আপলোড করুন</span>}
            <input type="file" accept="image/*" className="hidden" onChange={onHeroFile}/>
          </label>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Site Name (English)"><input value={form.site_name_en||''} onChange={e=>setForm({...form,site_name_en:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
          <Field label="সাইটের নাম (বাংলা)"><input value={form.site_name_bn||''} onChange={e=>setForm({...form,site_name_bn:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="ফোন নম্বর"><input value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
          <Field label="ঠিকানা"><input value={form.address||''} onChange={e=>setForm({...form,address:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="ডেলিভারি চার্জ (ঢাকা)"><input type="number" value={form.delivery_charge_dhaka} onChange={e=>setForm({...form,delivery_charge_dhaka:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
          <Field label="ডেলিভারি চার্জ (বাইরে)"><input type="number" value={form.delivery_charge_outside} onChange={e=>setForm({...form,delivery_charge_outside:e.target.value})} className="w-full border border-line rounded-xl px-4 py-2.5 bg-linen"/></Field>
        </div>
        <button disabled={loading} className="bg-forest text-white font-semibold px-6 py-3 rounded-full hover:bg-forestdeep flex items-center gap-2">{loading && <span className="spinner"></span>} সেটিংস সংরক্ষণ করুন</button>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
